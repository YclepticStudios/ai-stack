services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13-b10548
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:9931:9931"
    volumes:
      - ./.hf-cache:/root/.cache/huggingface:rw
      - ./preset.ini:/app/preset.ini:ro
      - ./ui-config.json:/app/ui-config.json:ro
    environment:
      HF_HOME: /root/.cache/huggingface
      LLAMA_ARG_CORS_ORIGINS: http://localhost:9931,http://127.0.0.1:9931
      LLAMA_ARG_MODELS_MAX: 1
      LLAMA_ARG_MODELS_PRESET: /app/preset.ini
      LLAMA_ARG_UI_CONFIG_FILE: /app/ui-config.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "9931"
