services:
  # Basalt inference engine
  basalt:
    build:
      context: https://github.com/jesdga95/basalt.git#v0.4.0
    container_name: basalt
    restart: unless-stopped
    ports:
      - "127.0.0.1:9931:9931"
    volumes:
      - ./.hf-cache/basalt:/models:ro
      - ./basalt/basalt_config.json:/data/basalt_config.json:ro
      - basalt-data:/data:rw
    stop_grace_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # MCP search + fetch
  mcp-search:
    build:
      context: ./mcp-search
    container_name: mcp-search
    restart: unless-stopped
    ports:
      - "127.0.0.1:9932:9932"

volumes:
  basalt-data:
