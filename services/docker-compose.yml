services:
  # llama.cpp inference engine with web chat UI
  llama-server:
    build:
      context: ./llamacpp
    container_name: llama-server
    restart: unless-stopped
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:9931:9931"
    volumes:
      - ./.hf-cache:/root/.cache/huggingface:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # NInfer inference engine
  ninfer:
    build:
      context: ./ninfer
    container_name: ninfer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9931:9931"
    volumes:
      - ./.hf-cache:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # MCP search + fetch
  mcp-search:
    build:
      context: ./mcp-search
    container_name: mcp-search
    restart: unless-stopped
    ports:
      - "127.0.0.1:9932:9932"
