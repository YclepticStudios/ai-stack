[project]
name = "mcp-search"
version = "0.1.0"
description = "Web search and fetch MCP server"
readme = "README.md"
authors = [{ name = "Ycleptic Studios", email = "ycleptic.studios@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["fastmcp", "ddgs", "curl_cffi", "trafilatura", "tenacity"]

[project.scripts]
mcp-search = "mcp_search.server:main"

[dependency-groups]
dev = ["ruff", "pyright", "taplo", "nodejs-wheel"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_search"
module-root = ""

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "BLE001", # blind-except: MCP tools return errors to the model instead of crashing
  "COM812", # missing-trailing-comma: May cause conflicts when used alongside Ruff's formatter
  "CPY001", # missing-copyright-notice: Missing copyright notice at top of file
  "FIX002", # line-contains-todo: Line contains TODO, consider resolving the issue
  "S101",   # assert: Use of `assert` detected
  "S104",   # bind-all-interfaces: 0.0.0.0 is required for Docker networking
  "TD003",  # missing-todo-link: Missing issue link on the line following TODO
  "TRY003", # raise-vanilla-args: Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.pydocstyle]
convention = "google"
